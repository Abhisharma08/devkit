name: Verify DevKit
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
      # The committed npm lockfile provides the exact tested graph while a
      # canonical pnpm lockfile awaits a registry-enabled pnpm installation.
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run release:package
      - run: pnpm exec playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run release:screenshots
      - uses: actions/upload-artifact@v4
        with:
          name: devkit-release
          path: release/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
